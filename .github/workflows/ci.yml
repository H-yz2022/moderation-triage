name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check src tests
      - run: pytest -q
        env:
          MODTRIAGE_PROVIDER: mock
      - name: Offline eval smoke test (mock provider, dev fixture)
        run: python -m modtriage.cli eval --modes single,full,cascade --boot 50
        env:
          MODTRIAGE_PROVIDER: mock

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t moderation-triage .
